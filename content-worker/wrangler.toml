name = "trackmyhairloss-content"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "baldwin-growth"
database_id = "48fcce74-b672-40aa-8080-9a04021cd5b9"

[vars]
AUTO_PUBLISH_STANDARD = "true"
AUTO_PUBLISH_MEDICAL = "true"
SITE_URL = "https://trackmyhairloss.com"
NCBI_TOOL = "trackmyhairloss"
NCBI_EMAIL = "threeamigosholdings@gmail.com"
SEO_AUTOPILOT = "true"
AUTO_WRITER = "true"
AUTO_CONTENT_MAX_ATTEMPTS = "4"
SEO_REFRESH_MEDICAL = "true"
GSC_SITE_URL = "sc-domain:trackmyhairloss.com"
GSC_LOOKBACK_DAYS = "28"
GSC_DATA_LAG_DAYS = "3"

[triggers]
crons = ["* * * * *", "17 1,7,13,19 * * *"]

[[routes]]
pattern = "trackmyhairloss.com/blog*"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/compare*"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/treatments*"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/sitemap.xml"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/llms.txt"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/indexnow-key.txt"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/articles"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/articles.json"
zone_name = "trackmyhairloss.com"

[[routes]]
pattern = "trackmyhairloss.com/feed.xml"
zone_name = "trackmyhairloss.com"
