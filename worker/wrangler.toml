name = "baldwin-growth-api"
main = "src/agentIndex.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://getbaldwin.app,https://trybaldwin.app,https://trackmyhairloss.com,http://localhost:8788,http://localhost:8000"
OUTREACH_FROM = "Sean from Baldwin <sean@trybaldwin.app>"
REPLY_DOMAIN = "trybaldwin.app"
OPENAI_MODEL = "gpt-5.6-luna"
AGENT_MAX_DAILY_SENDS = "40"

[[d1_databases]]
binding = "DB"
database_name = "baldwin-growth"
database_id = "48fcce74-b672-40aa-8080-9a04021cd5b9"

[[services]]
binding = "CONTENT"
service = "trackmyhairloss-content"

# Secret used by baldwin-api to relay authenticated app lifecycle events into
# this canonical Growth API event store. Configure the same value on both Workers:
# npx wrangler secret put APP_EVENT_SECRET
# App Store Connect secrets used for synchronous provider + 50%-off offer provisioning:
# npx wrangler secret put ASC_ISSUER_ID
# npx wrangler secret put ASC_KEY_ID
# npx wrangler secret put ASC_PRIVATE_KEY
# npx wrangler secret put ASC_PROVIDER_OFFER_ID
