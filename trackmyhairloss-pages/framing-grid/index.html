BaldwinGrowth.event('tool_open',{tool:'framing_grid'});const c=document.getElementById('canvas'),x=c.getContext('2d');let img=null;function draw(){x.fillStyle='#ddd';x.fillRect(0,0,c.width,c.height);if(img){const s=Math.max(c.width/img.width,c.height/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h)}x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=4;x.setLineDash([18,12]);const st=document.getElementById('style').value;if(st==='thirds'){[1/3,1/2,2/3].forEach(p=>{x.beginPath();x.moveTo(c.width*p,0);x.lineTo(c.width*p,c.height);x.stroke()});[1/3,2/3].forEach(p=>{x.beginPath();x.moveTo(0,c.height*p);x.lineTo(c.width,c.height*p);x.stroke()})}if(st==='cross'){x.beginPath();x.moveTo(c.width/2,0);x.lineTo(c.width/2,c.height);x.moveTo(0,c.height/2);x.lineTo(c.width,c.height/2);x.stroke()}if(st==='box'){x.strokeRect(c.width*.12,c.height*.12,c.width*.76,c.height*.76);x.beginPath();x.moveTo(c.width/2,c.height*.12);x.lineTo(c.width/2,c.height*.88);x.stroke()}x.setLineDash([])}draw();document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{img=i;draw();URL.revokeObjectURL(u)};i.src=u};document.getElementById('style').onchange=draw;document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='hair-photo-framing-reference.png';a.href=c.toDataURL('image/png');a.click();BaldwinGrowth.event('tool_used',{tool:'framing_grid'})};
