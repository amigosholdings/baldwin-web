name: Improve content queue status

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/improve-content-queue-status.mjs'
      - '.github/workflows/improve-content-queue-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply queue status patch
        run: node .github/scripts/improve-content-queue-status.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackmyhairloss-pages/ops/index.html
          git commit -m "Show explicit content queue dispatch status"
          git push origin HEAD:main
