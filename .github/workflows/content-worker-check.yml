name: Content worker checks

on:
  pull_request:
    paths:
      - 'content-worker/**'
      - '.github/workflows/content-worker-check.yml'
  push:
    branches:
      - main
    paths:
      - 'content-worker/**'
      - '.github/workflows/content-worker-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: content-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run syntax and regression checks
        run: npm run check
