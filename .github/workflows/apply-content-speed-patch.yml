name: Apply content speed patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply-content-speed-patch.mjs'
      - '.github/workflows/apply-content-speed-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node .github/scripts/apply-content-speed-patch.mjs
      - name: Validate JavaScript
        run: |
          node --check content-worker/src/index.js
          node --check content-worker/src/worker.js
          git diff --check
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-worker/src/index.js trackmyhairloss-pages/ops/index.html
          git commit -m "Parallelize content research and show live progress"
          git push origin HEAD:main
