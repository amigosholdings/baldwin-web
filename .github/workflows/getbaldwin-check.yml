name: GetBaldwin Check

on:
  pull_request:
    paths:
      - 'getbaldwin-pages/**'
      - '.github/workflows/getbaldwin-check.yml'
  push:
    branches: [main]
    paths:
      - 'getbaldwin-pages/**'
      - '.github/workflows/getbaldwin-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: getbaldwin-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: getbaldwin-pages/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run deploy:dry
